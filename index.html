  <!-- Applique l'apparence mémorisée avant le premier rendu (évite un flash clair/sombre) -->
  <script>
    (function () {
      try {
        var mode = window.localStorage.getItem('ka.theme');
        if (mode === 'light' || mode === 'dark') document.documentElement.setAttribute('data-theme', mode);
      } catch (e) { }
    })();
  </script>
