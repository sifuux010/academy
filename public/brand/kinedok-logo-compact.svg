    Version compacte (symbole + signature, sans baseline) : lisible dans
    l'en-tête à 42 px de haut, là où la ligne « La Kiné, maintenant »
    deviendrait illisible.

    Version BICOLORE, destinée au thème clair : « Kine » en bleu ardoise,
    « dok » en turquoise, comme la charte KINEDOK.
    Pour le thème sombre, voir kinedok-logo-compact-dark.svg (monochrome
    turquoise) : le bleu ardoise serait illisible sur fond sombre.
  -->
  <defs>
    <linearGradient id="kdCompact" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="560" y2="170">
      <stop offset="0" stop-color="#45D6E2"/>
      <stop offset="0.5" stop-color="#2BBECD"/>
      <stop offset="1" stop-color="#1795A8"/>
    </linearGradient>
  </defs>

